<!doctype html>
<html><head><meta charset="utf-8">
<!-- Эндкарта (правило rules/end-card.md). Рендер: scripts/render_html.py ... --cfg <cfg.json> --size 1440x2560 (без --alpha).
     window.CFG = {
       bg:"абс. путь к подложке (чистый кадр без текста)", icon:"абс. путь к иконке из App Store 1024x1024 (квадрат без скругления)",
       title:"Example App", tagline:"A plan for healthier years ahead.", sub:"Works with your Garmin" (необязательно), cta:"Try the app",
       ink:"light|dark"  (цвет текста под фон), accent:"#EA4E1C" (цвет кнопки = цвет иконки),
       t0: сек начала эндкарты во времени ролика, dur: длительность }
     Иконка скругляется маской (22.37 % стороны, как в iOS), без обводки; текст без stroke и ореолов. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800;900&family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:720px;height:1280px;overflow:hidden;background:#0B0E13;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#bg{position:absolute;inset:0;background-size:cover;background-position:center;transform-origin:50% 40%}
#scrim{position:absolute;left:0;right:0;top:0;height:560px}
.light #scrim{background:linear-gradient(180deg,rgba(6,8,12,.55),rgba(6,8,12,.28) 45%,rgba(6,8,12,0))}
.dark #scrim{height:620px;background:linear-gradient(180deg,rgba(250,247,242,.86),rgba(250,247,242,.72) 48%,rgba(250,247,242,.3) 72%,rgba(250,247,242,0))}
#bscrim{position:absolute;left:0;right:0;bottom:0;height:360px;background:linear-gradient(0deg,rgba(6,8,12,.35),rgba(6,8,12,0))}
.abs{position:absolute;left:0;right:0;text-align:center;will-change:transform,opacity}
#icon{left:50%;top:92px;width:150px;height:150px;margin-left:-75px;border-radius:22.37%;overflow:hidden;
  box-shadow:0 14px 34px rgba(0,0,0,.28),0 3px 8px rgba(0,0,0,.18);transform:translateZ(0)}
#icon img{width:100%;height:100%;display:block}
#title{top:268px;font:800 76px/1 'Inter Tight';letter-spacing:-.035em}
#tag{top:360px;font:600 27px/1.25 Inter;letter-spacing:-.005em;padding:0 60px}
#sub{top:448px;font:600 21px/1 Inter;letter-spacing:.01em}
.light #sub{color:rgba(255,255,255,.7)}.dark #sub{color:rgba(20,22,26,.6)}
.light #title{color:#FFFFFF}.light #tag{color:rgba(255,255,255,.88)}
.dark #title{color:#14161A}.dark #tag{color:rgba(20,22,26,.78)}
#cta{left:50%;bottom:300px;width:540px;height:100px;margin-left:-270px;border-radius:50px;display:flex;align-items:center;justify-content:center;
  font:800 36px/1 'Inter Tight';letter-spacing:-.01em;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.22)}
</style></head>
<body><div id="root"><div id="bg"></div><div id="scrim"></div><div id="bscrim"></div>
<div class="abs" id="icon"><img id="ico"></div>
<div class="abs" id="title"></div><div class="abs" id="tag"></div><div class="abs" id="sub"></div>
<div class="abs" id="cta"></div></div>
<script>
const C=window.CFG||{};
document.getElementById('root').className=C.ink||'light';
document.getElementById('bg').style.backgroundImage=`url("${C.bg}")`;
document.getElementById('ico').src=C.icon;
document.getElementById('title').textContent=C.title||'';
document.getElementById('tag').textContent=C.tagline||'';
document.getElementById('sub').textContent=C.sub||'';
const cta=document.getElementById('cta');cta.textContent=C.cta||'';cta.style.background=C.accent||'#EA4E1C';if(!C.cta)cta.style.display='none';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),p=(t,a,d)=>cl((t-a)/d);
const eo=x=>1-Math.pow(1-cl(x),3),eb=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const $=id=>document.getElementById(id);
window.render=function(T){const t=T-(C.t0||0),D=C.dur||3;
 $('bg').style.transform=`scale(${1.0+0.035*p(t,0,D)})`;
 const ic=eb(p(t,0,.5));$('icon').style.opacity=eo(p(t,0,.25));$('icon').style.transform=`scale(${.86+.14*ic})`;
 [['title',.12],['tag',.22],['sub',.3]].forEach(([id,a])=>{$(id).style.opacity=eo(p(t,a,.35));$(id).style.transform=`translateY(${(1-eo(p(t,a,.45)))*18}px)`});
 const c=eb(p(t,.38,.5));cta.style.opacity=eo(p(t,.38,.25));
 const pulse=t>1.1?1+.025*Math.sin((t-1.1)*Math.PI*1.6):1;
 cta.style.transform=`translateY(${(1-c)*40}px) scale(${pulse})`;
};
</script></body></html>
