<!doctype html>
<html><head><meta charset="utf-8">
<!-- Эндкарта уровня коммерческой рекламы (rules/end-card.md). Три варианта: hero | brand | product.
     render_html.py templates/end_card/end_card.html - <t0> <t1> ec.mp4 --size 1080x1920 --cfg ec.json
     window.CFG = {
       variant: "hero" | "brand" | "product",
       icon: путь к иконке из App Store 1024 (квадрат), accent: "#EA4E1C" (цвет иконки),
       headline: "Know your real<br>biological age"  — выгода, а не название (название уже на иконке),
       sub: "From the Garmin you already wear"      — одна строка, ≥ 44 px при 1080,
       partner: "Garmin"  (необязательно, только текст, без чужих логотипов),
       rating: 4.5, store: "App Store"  (необязательно, ТОЛЬКО реальные данные из iTunes API),
       cta: "Get Longy — it's free",
       screen: путь к реальному скрину приложения (для product),
       bg: путь к картинке фона (необязательно; размытый тёмный кадр героя — только по прямой просьбе),
       from: путь к последнему кадру ролика — мягкий переход 0.35 c вместо жёсткой склейки,
       t0, dur }
     Шкала (css 720 → ×1.5 = px при 1080): заголовок 70 (105), CTA 40 (60), подпись 32 (48), мелочь ≥ 30 (45). -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;900&family=Inter:wght@500;600;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:720px;height:1280px;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;background:#000}
.abs{position:absolute;will-change:transform,opacity}
#root{position:absolute;inset:0;overflow:hidden}
#bg,#from{position:absolute;inset:-4%;background-size:cover;background-position:center}
#grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#glow{position:absolute;width:900px;height:900px;left:-90px;top:-80px;border-radius:50%;filter:blur(30px)}
#icon{left:50%;border-radius:22.37%;overflow:hidden;transform-origin:50% 60%}
#icon img{width:100%;height:100%;display:block}
#head{left:56px;right:56px;text-align:center;font:900 70px/1.0 'Inter Tight';letter-spacing:-.04em;text-wrap:balance}
#sub{left:56px;right:56px;text-align:center;font:600 32px/1.25 Inter;letter-spacing:-.01em}
#meta{left:0;right:0;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:10px;height:60px;padding:0 24px;border-radius:30px;font:700 30px/1 'Inter Tight';letter-spacing:-.01em;white-space:nowrap}
.stars{letter-spacing:2px;font-size:28px}
#cta{left:50%;width:600px;height:112px;margin-left:-300px;border-radius:56px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  font:800 40px/1 'Inter Tight';letter-spacing:-.015em}
#cta .sh{position:absolute;top:-20%;bottom:-20%;width:120px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg)}
#phone{left:50%;width:280px;height:575px;margin-left:-140px;border-radius:48px;padding:12px;background:#0d0f13;
  box-shadow:0 0 0 2px #2c2f36,0 40px 90px rgba(0,0,0,.55)}
#phone .scr{width:100%;height:100%;border-radius:38px;overflow:hidden;background:#fff}
#phone .scr img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
#phone .isl{position:absolute;left:50%;top:22px;width:92px;height:26px;margin-left:-46px;border-radius:14px;background:#000}
/* --- варианты --- */
.hero{background:linear-gradient(180deg,#FFF8F3 0%,#FDEBDF 100%)}
.hero #glow{background:radial-gradient(closest-side,rgba(234,78,28,.28),rgba(234,78,28,0))}
.hero #head{color:#16110E}.hero #sub{color:#5B4A40}
.hero .chip{background:#fff;color:#16110E;box-shadow:0 6px 18px rgba(80,30,10,.10)}
.hero .stars{color:#F5A623}
.hero #cta{background:var(--acc);color:#fff;box-shadow:0 18px 40px rgba(234,78,28,.38)}
.brand{background:linear-gradient(165deg,#F2602A 0%,#C73A12 46%,#2A0D05 100%)}
.brand #glow{background:radial-gradient(closest-side,rgba(255,190,140,.35),rgba(255,190,140,0))}
.brand #head{color:#fff}.brand #sub{color:rgba(255,255,255,.86)}
.brand .chip{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(10px)}
.brand .stars{color:#FFD27A}
.brand #cta{background:#fff;color:#C73A12;box-shadow:0 18px 44px rgba(0,0,0,.35)}
.brand #icon{box-shadow:0 26px 60px rgba(40,8,0,.55)}
.product{background:radial-gradient(120% 70% at 50% 30%,#1C222C 0%,#0B0E13 70%)}
.product #glow{background:radial-gradient(closest-side,rgba(234,78,28,.30),rgba(234,78,28,0))}
.product #head{color:#F4F1EA}.product #sub{color:rgba(244,241,234,.72)}
.product .chip{background:rgba(255,255,255,.08);color:#F4F1EA}
.product .stars{color:#F5A623}
.product #cta{background:var(--acc);color:#fff;box-shadow:0 18px 44px rgba(234,78,28,.35)}
.hero #icon,.product #icon{box-shadow:0 22px 50px rgba(60,20,5,.28),0 4px 10px rgba(60,20,5,.16)}
#scrim{position:absolute;left:0;right:0;top:0;height:820px;display:none}
.photo.hero #scrim{display:block;background:linear-gradient(180deg,rgba(8,6,5,.78) 0%,rgba(8,6,5,.62) 45%,rgba(8,6,5,0) 100%)}
.photo.hero #head{color:#fff}.photo.hero #sub{color:rgba(255,255,255,.88)}
.photo.hero .chip{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(12px);box-shadow:none}
.photo.hero #glow{display:none}
</style></head>
<body><div id="root">
<div id="bg"></div><div id="scrim"></div><div id="glow"></div><div id="grain"></div>
<div class="abs" id="icon"><img id="ico"></div>
<div class="abs" id="phone"><div class="scr"><img id="scr"></div><div class="isl"></div></div>
<div class="abs" id="head"></div><div class="abs" id="sub"></div>
<div class="abs" id="meta"></div>
<div class="abs" id="cta"><span id="ctat"></span><div class="sh" id="sh"></div></div>
<div id="from"></div>
</div>
<script>
const C=window.CFG||{};const V=C.variant||'hero';const $=id=>document.getElementById(id);
const root=$('root');root.className=V+(C.bg&&V!=='product'?' photo':'');root.style.setProperty('--acc',C.accent||'#EA4E1C');
if(C.bg){$('bg').style.backgroundImage=`url("${C.bg}")`}else $('bg').style.display='none';
if(C.from)$('from').style.backgroundImage=`url("${C.from}")`;else $('from').style.display='none';
$('ico').src=C.icon;$('head').innerHTML=C.headline||'';$('sub').textContent=C.sub||'';$('ctat').textContent=C.cta||'';
if(C.screen)$('scr').src=C.screen;
const chips=[];
if(C.rating){const full=Math.floor(C.rating),half=C.rating-full>=.5;chips.push(`<span class="chip"><span class="stars">${'★'.repeat(full)}${half?'½':''}</span>${C.rating.toFixed(1)} · ${C.store||'App Store'}</span>`)}
if(C.partner)chips.push(`<span class="chip">Works with ${C.partner}</span>`);
$('meta').innerHTML=chips.join('');
// раскладка по вариантам (css px; безопасная зона: 147…1027)
const L={hero:{icon:[180,165],head:380,sub:540,meta:620,cta:860,phone:null},
         brand:{icon:[170,180],head:400,sub:560,meta:650,cta:850,phone:null},
         product:{icon:[96,160],head:160,sub:null,meta:null,cta:905,phone:300}}[V];
const ic=$('icon');ic.style.width=ic.style.height=L.icon[0]+'px';ic.style.marginLeft=-L.icon[0]/2+'px';ic.style.top=L.icon[1]+'px';
if(V==='product'){ic.style.left='56px';ic.style.marginLeft='0';$('head').style.left='170px';$('head').style.right='40px';$('head').style.textAlign='left';
  $('head').style.font="900 46px/1.02 'Inter Tight'";$('sub').style.display='none';$('meta').style.display='none';}
else $('phone').style.display='none';
$('head').style.top=L.head+'px';if(L.sub)$('sub').style.top=L.sub+'px';if(L.meta)$('meta').style.top=L.meta+'px';
$('cta').style.top=L.cta+'px';if(L.phone)$('phone').style.top=L.phone+'px';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),p=(t,a,d)=>cl((t-a)/d);
const eo=x=>1-Math.pow(1-cl(x),3);
const spring=x=>{x=cl(x);return 1-Math.exp(-6*x)*Math.cos(9*x)};   // пружина с лёгким перелётом
function inn(el,t,a,dy=36,s0=.94){const k=spring(p(t,a,.7));el.style.opacity=eo(p(t,a,.3));el.style.transform=`translateY(${(1-k)*dy}px) scale(${s0+(1-s0)*k})`}
window.render=function(T){const t=T-(C.t0||0),D=C.dur||3;
 {const x=p(t,0,.4);$('from').style.opacity=1-x*x*(3-2*x);}          // мягкий переход: smoothstep 0.4 c (без скачка, который cut_check примет за склейку)
 $('bg').style.transform=`scale(${1.02+.03*p(t,0,D)})`;
 $('glow').style.transform=`translate(${Math.sin(t*.9)*30}px,${Math.cos(t*.7)*24}px)`;   // фон живой, без статики
 const k=spring(p(t,.1,.8));ic.style.opacity=eo(p(t,.1,.3));
 ic.style.transform=`translateY(${(1-k)*50 + Math.sin(t*2.2)*4}px) scale(${.7+.3*k})`;
 inn($('head'),t,.25);inn($('sub'),t,.38);inn($('meta'),t,.48);
 if(V==='product'){const kp=spring(p(t,.2,.9));const ph=$('phone');ph.style.opacity=eo(p(t,.2,.3));
   ph.style.transform=`translateY(${(1-kp)*120+Math.sin(t*1.6)*6}px) rotate(${-4+4*kp+Math.sin(t*1.2)*.8}deg)`}
 const c=$('cta');const kc=spring(p(t,.55,.7));c.style.opacity=eo(p(t,.55,.25));
 const pulse=t>1.2?1+.035*Math.max(0,Math.sin((t-1.2)*Math.PI*1.4)):1;
 c.style.transform=`translateY(${(1-kc)*60}px) scale(${(.9+.1*kc)*pulse})`;
 const ps=((t-1.0)%1.6)/1.6;$('sh').style.left=(t<1.0?-200:-160+ps*800)+'px';
};
</script></body></html>
